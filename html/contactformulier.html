<!DOCTYPE html>
<html lang="nl">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Contactformulier</title>
        <link rel="stylesheet" href="../css/contactformulier-style.css">
    </head>
    <body>
        <header>
            <h1>Contactformulier</h1>
        </header>

        <nav>
            <a class="home" href="../index.html">Terug naar Home</a>
            <a class="wieBenIk" href="WhoAmI.html">WhoAmI</a>
            <a class="projecten" href="projecten.html">Projecten</a>
            <a class="blog" href="blog.html">Mijn blog</a>
        </nav>

        <main>
            <form id="contactForm">
                <label for="naam">Naam:</label>
                <input type="text" id="naam" name="naam" required minlength="2" aria-describedby="naamError" aria-invalid="false">
                <span id="naamError" class="error-message" role="alert"></span>

                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required aria-describedby="emailError" aria-invalid="false">
                <span id="emailError" class="error-message" role="alert"></span>

                <label for="bericht">Bericht:</label>
                <textarea id="bericht" name="bericht" required minlength="10" aria-describedby="berichtError" aria-invalid="false"></textarea>
                <span id="berichtError" class="error-message" role="alert"></span>

                <button type="submit">Verzenden</button>
                <div id="formstatus" aria-live="polite"></div>
            </form>
        </main>

        <script src="../js/contactformulier-script.js"></script>
    </body>
</html>
